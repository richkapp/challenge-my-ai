name: Bug report
about: Report reproducible incorrect behavior
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe reproduction. Remove credentials and real user data.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
  - type: textarea
    id: impact
    attributes:
      label: Impact
  - type: markdown
    attributes:
      value: "For vulnerabilities, authorization bypasses, credential exposure, or privacy leaks, stop and use a private GitHub security advisory instead."
